server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: auditrail-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/auditrail?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:auditrail_app}
    password: ${SPRING_DATASOURCE_PASSWORD:auditrail_secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

auditrail:
  security:
    jwt-secret: ${JWT_SECRET:AuditRailSuperSecretKeyForSigningJwtTokensMinimum256BitsLong2026!}
    jwt-expiration-ms: 86400000 # 24 hours
  storage:
    provider: ${STORAGE_PROVIDER:LOCAL} # LOCAL, MINIO, AMAZON_S3
    local-dir: ${STORAGE_LOCAL_DIR:./checkpoints_storage}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:auditrail-checkpoints}
  scheduling:
    verification-cron: "0 0 * * * *" # Hourly
