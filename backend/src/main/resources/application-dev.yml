spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:auditrail_dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

auditrail:
  storage:
    provider: LOCAL
    local-dir: ./local_dev_checkpoints
