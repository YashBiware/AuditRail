services:
  # ----------------------------------------------------------------------------
  # 1. Primary Relational Store: MySQL 8.0 (InnoDB Append-Only Ledger)
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0.36
    container_name: auditrail-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password_2026!
      MYSQL_DATABASE: auditrail
      MYSQL_USER: auditrail_app
      MYSQL_PASSWORD: auditrail_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --explicit_defaults_for_timestamp=1
      --innodb_buffer_pool_size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "auditrail_app", "-pauditrail_secret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - auditrail-network

  # ----------------------------------------------------------------------------
  # 2. Immutable Storage Emulator: MinIO (S3 Object Lock / WORM Emulation)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: auditrail-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword2026!
    ports:
      - "9000:9000"   # S3 API endpoint
      - "9001:9001"   # MinIO Web Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - auditrail-network

  # ----------------------------------------------------------------------------
  # 2b. MinIO Bucket Initialization Helper (Ensures WORM bucket exists)
  # ----------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: auditrail-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadminpassword2026!;
      mc mb --with-lock myminio/auditrail-checkpoints || true;
      mc version enable myminio/auditrail-checkpoints || true;
      exit 0;
      "
    networks:
      - auditrail-network

  # ----------------------------------------------------------------------------
  # 3. Core Modular Monolith Engine: Spring Boot Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: auditrail/backend:1.0.0
    container_name: auditrail-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auditrail?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: auditrail_app
      SPRING_DATASOURCE_PASSWORD: auditrail_secret
      STORAGE_PROVIDER: AWS_S3
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadminpassword2026!
      AWS_S3_BUCKET: auditrail-checkpoints
      AWS_REGION: us-east-1
      AWS_S3_PATH_STYLE_ACCESS: "true"
      AWS_S3_RETENTION_DAYS: 365
      JWT_SECRET: AuditRailSuperSecretKeyForSigningJwtTokensMinimum256BitsLong2026!
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/policy/dpdp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - auditrail-network

  # ----------------------------------------------------------------------------
  # 4. Operator Console & Visualizer: React / Vite Web Application
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: auditrail/frontend:1.0.0
    container_name: auditrail-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - auditrail-network

networks:
  auditrail-network:
    name: auditrail-network
    driver: bridge

volumes:
  mysql_data:
    name: auditrail-mysql-data
  minio_data:
    name: auditrail-minio-data
