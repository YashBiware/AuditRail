&quot;1\&quot; connectable=\&quot;0\&quot; parent=\&quot;fk_head_events\&quot;>\n          <mxGeometry x=\&quot;0.4\&quot; relative=\&quot;1\&quot; as=\&quot;geometry\&quot;>\n            <mxPoint as=\&quot;offset\&quot; />\n          </mxGeometry>\n        </mxCell>\n        <mxCell id=\&quot;fk_events_verify\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;t_audit_events\&quot; target=\&quot;t_verification_runs\&quot; style=\&quot;endArrow=open;endFill=0;strokeColor=#333333;\&quot;>\n          <mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot; />\n        </mxCell>\n        <mxCell id=\&quot;lbl_fk_verify\&quot; value=\&quot;1 : N\&quot; style=\&quot;edgeLabel;html=1;align=center;verticalAlign=middle;resizable=0;points=[];fontSize=10;fontStyle=1;\&quot; vertex=\&quot;1\&quot; connectable=\&quot;0\&quot; parent=\&quot;fk_events_verify\&quot;>\n          <mxGeometry x=\&quot;0.1\&quot; relative=\&quot;1\&quot; as=\&quot;geometry\&quot;>\n            <mxPoint as=\&quot;offset\&quot; />\n          </mxGeometry>\n        </mxCell>\n      </root>\n    </mxGraphModel>\n  </diagram>\n  <diagram id=\&quot;physical_db_clean\&quot; name=\&quot;3.4.2 Physical Database Design\&quot;>\n    <mxGraphModel background=\&quot;#ffffff\&quot; dx=\&quot;1000\&quot; dy=\&quot;1400\&quot; grid=\&quot;1\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;827\&quot; pageHeight=\&quot;1169\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot;>\n      <root>\n        <mxCell id=\&quot;0\&quot; />\n        <mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot; />\n        <mxCell id=\&quot;title\&quot; value=\&quot;&lt;b style=&quot;font-size: 15px;&quot;&gt;Figure 3.4.2: Physical Database Design (MySQL 8.0 / InnoDB Engine Storage &amp;amp; B-Tree Index Topology)&lt;/b&gt;\&quot; style=\&quot;text;html=1;strokeColor=none;fillColor=none;align=center;verticalAlign=middle;whiteSpace=wrap;rounded=0;fontStyle=1;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;>\n          <mxGeometry x=\&quot;64\&quot; y=\&quot;30\&quot; width=\&quot;700\&quot; height=\&quot;30\&quot; as=\&quot;geometry\&quot; />\n        </mxCell>\n        <mxCell id=\&quot;p_audit_events\&quot; value=\&quot;&lt;b style=&quot;font-size: 11.5px;&quot;&gt;TABLE: audit_events (ENGINE=InnoDB, ROW_FORMAT=DYNAMIC, CHARSET=utf8mb4)&lt;/b&gt;&lt;hr&gt;&lt;b&gt;PHYSICAL COLUMN SPECIFICATION:&lt;/b&gt;&lt;br&gt;* &lt;b&gt;id&lt;/b&gt; : CHAR(36) NOT NULL [36 Bytes Clustered Primary Key Inode]&lt;br&gt;* &lt;b&gt;organization_id&lt;/b&gt; : CHAR(36) NOT NULL [36 Bytes Tenant Isolation Key]&lt;br&gt;* &lt;b&gt;sequence_number&lt;/b&gt; : BIGINT UNSIGNED NOT NULL [8 Bytes Monotonic Sequence 1, 2, 3...]&lt;br&gt;* &lt;b&gt;event_action&lt;/b&gt; : VARCHAR(100) NOT NULL [1-100 Bytes UTF-8 Variable String]&lt;br&gt;* &lt;b&gt;actor_id&lt;/b&gt; : VARCHAR(100) NOT NULL [1-100 Bytes Principal Identifier]&lt;br&gt;* &lt;b&gt;target_id&lt;/b&gt; : VARCHAR(100) NOT NULL [1-100 Bytes Entity Subject]&lt;br&gt;* &lt;b&gt;payload&lt;/b&gt; : TEXT NOT NULL [LOB Overflow Page Storage, RFC 8785 Canonical JSON]&lt;br&gt;* &lt;b&gt;record_hash&lt;/b&gt; : CHAR(64) NOT NULL [64 Bytes Hexadecimal SHA-256 Digest]&lt;br&gt;* &lt;b&gt;prev_record_hash&lt;/b&gt; : CHAR(64) NOT NULL [64 Bytes Predecessor Digest Link]&lt;br&gt;* &lt;b&gt;created_at&lt;/b&gt; : DATETIME(6) NOT NULL [8 Bytes Microsecond Precision UTC Timestamp]&lt;hr&gt;&lt;b&gt;B-TREE INDEX TOPOLOGY &amp;amp; BUFFER ALLOCATION:&lt;/b&gt;&lt;br&gt;1. &lt;b&gt;PRIMARY KEY (id)&lt;/b&gt; USING BTREE [Clustered Index, In-Memory Buffer Pool]&lt;br&gt;2. &lt;b&gt;UNIQUE KEY uq_org_seq (organization_id, sequence_number)&lt;/b&gt; USING BTREE [Composite Cover]&lt;br&gt;3. &lt;b&gt;KEY idx_org_created (organization_id, created_at)&lt;/b&gt; USING BTREE [Time-Range Scan Acceleration]&lt;br&gt;4. &lt;b&gt;KEY idx_record_hash (record_hash)&lt;/b&gt; USING BTREE [O(log N) Cryptographic Point Lookup]\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#333333;align=left;spacingLeft=10;fontSize=10;verticalAlign=top;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;>\n          <mxGeometry x=\&quot;64\&quot; y=\&quot;80\&quot; width=\&quot;700\&quot; height=\&quot;295\&quot; as=\&quot;geometry\&quot; />\n        </mxCell>\n        <mxCell id=\&quot;p_chain_heads\&quot; value=\&quot;&lt;b style=&quot;font-size: 11px;&quot;&gt;TABLE: chain_heads (Pessimistic Row Lock)&lt;/b&gt;&lt;hr&gt;&lt;b&gt;PHYSICAL SPECIFICATIONS:&lt;/b&gt;&lt;br&gt;* &lt;b&gt;organization_id&lt;/b&gt; : CHAR(36) NOT NULL [PK Inode]&lt;br&gt;* &lt;b&gt;head_sequence_number&lt;/b&gt; : BIGINT UNSIGNED NOT NULL&lt;br&gt;* &lt;b&gt;head_record_hash&lt;/b&gt; : CHAR(64) NOT NULL [SHA-256]&lt;br&gt;* &lt;b&gt;genesis_hash&lt;/b&gt; : CHAR(64) NOT NULL [64 Zeros]&lt;br&gt;* &lt;b&gt;updated_at&lt;/b&gt; : DATETIME(6) NOT NULL [Microsecond]&lt;hr&gt;&lt;b&gt;LOCKING TOPOLOGY:&lt;/b&gt;&lt;br&gt;PRIMARY KEY (organization_id) USING BTREE&lt;br&gt;&lt;i&gt;Target of SELECT ... FOR UPDATE exclusive row lock&lt;/i&gt;\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#333333;align=left;spacingLeft=10;fontSize=10;verticalAlign=top;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;>\n          <mxGeometry x=\&quot;64\&quot; y=\&quot;405\&quot; width=\&quot;335\&quot; height=\&quot;225\&quot; as=\&quot;geometry\&quot; />\n        </mxCell>\n        <mxCell id=\&quot;p_checkpoints\&quot; value=\&quot;&lt;b style=&quot;font-size: 11px;&quot;&gt;TABLE: checkpoints (WORM Storage Anchors)&lt;/b&gt;&lt;hr&gt;&lt;b&gt;PHYSICAL SPECIFICATIONS:&lt;/b&gt;&lt;br&gt;* &lt;b&gt;id&lt;/b&gt; : CHAR(36) NOT NULL [36 Bytes PK]&lt;br&gt;* &lt;b&gt;organization_id&lt;/b&gt; : CHAR(36) NOT NULL [FK Inode]&lt;br&gt;* &lt;b&gt;sequence_number&lt;/b&gt; : BIGINT UNSIGNED NOT NULL&lt;br&gt;* &lt;b&gt;checkpoint_hash&lt;/b&gt; : CHAR(64) NOT NULL [SHA-256]&lt;br&gt;* &lt;b&gt;storage_provider&lt;/b&gt; : VARCHAR(32) NOT NULL&lt;br&gt;* &lt;b&gt;s3_bucket&lt;/b&gt; : VARCHAR(100) NOT NULL&lt;br&gt;* &lt;b&gt;s3_object_key&lt;/b&gt; : VARCHAR(255) NOT NULL&lt;br&gt;* &lt;b&gt;s3_version_id&lt;/b&gt; : VARCHAR(100) [WORM Version]&lt;br&gt;* &lt;b&gt;created_at&lt;/b&gt; : DATETIME(6) NOT NULL [Microsecond]&lt;hr&gt;&lt;b&gt;INDEX TOPOLOGY:&lt;/b&gt;&lt;br&gt;PRIMARY KEY (id) USING BTREE&lt;br&gt;KEY idx_cp_org_seq (organization_id, sequence_number)\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#333333;align=left;spacingLeft=10;fontSize=10;verticalAlign=top;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;>\n          <mxGeometry x=\&quot;429\&quot; y=\&quot;405\&quot; width=\&quot;335\&quot; height=\&quot;225\&quot; as=\&quot;geometry\&quot; />\n        </mxCell>\n        <mxCell id=\&quot;p_hardening_box\&quot; value=\&quot;&lt;b style=&quot;font-size: 11.5px;&quot;&gt;HARDWARE, MEMORY &amp;amp; OUT-OF-BAND IMMUTABILITY POLICIES&lt;/b&gt;&lt;hr&gt;&lt;b&gt;1. Buffer Pool Optimization (innodb_buffer_pool_size = 256M):&lt;/b&gt;&lt;br&gt;Indexes &lt;i&gt;uq_org_seq&lt;/i&gt; and &lt;i&gt;chain_heads&lt;/i&gt; are locked resident in RAM. This provides sub-millisecond execution times for pessimistic write locks and eliminates disk I/O bottlenecks during peak transaction ingestion bursts.&lt;br&gt;&lt;br&gt;&lt;b&gt;2. Zero Page Splitting Overhead:&lt;/b&gt;&lt;br&gt;Because sequence numbers strictly increment by +1 (1, 2, 3...) per tenant, all B-Tree leaf insertions occur monotonically at the rightmost page node, ensuring 100% fill factor with zero index fragmentation or page splits.&lt;br&gt;&lt;br&gt;&lt;b&gt;3. Out-of-Band Hardware Immutability (AWS S3 Object Lock COMPLIANCE Mode):&lt;/b&gt;&lt;br&gt;Checkpoint digests are replicated directly to AWS S3 Object Lock buckets with Legal Hold ON, encrypted via dedicated AWS KMS Customer Managed Keys. S3 WORM hardware-level write protection rejects all database administrator (DBA) delete or overwrite operations.\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#333333;align=left;spacingLeft=10;fontSize=10;verticalAlign=top;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;>\n          <mxGeometry x=\&quot;64\&quot; y=\&quot;660\&quot; width=\&quot;700\&quot; height=\&quot;205\&quot; as=\&quot;geometry\&quot; />\n        </mxCell>\n      </root>\n    </mxGraphModel>\n  </diagram>\n</mxfile>&quot;}">
