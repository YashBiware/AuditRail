server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: auditrail-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/auditrail?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:auditrail_app}
    password: ${SPRING_DATASOURCE_PASSWORD:auditrail_secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

auditrail:
  security:
    jwt-secret: ${JWT_SECRET:AuditRailSuperSecretKeyForSigningJwtTokensMinimum256BitsLong2026!}
    jwt-expiration-ms: 86400000 # 24 hours
  storage:
    provider: ${STORAGE_PROVIDER:LOCAL} # LOCAL, AWS_S3
    local-dir: ${STORAGE_LOCAL_DIR:./checkpoints_storage}
    s3:
      bucket: ${AWS_S3_BUCKET:auditrail-checkpoints}
      region: ${AWS_REGION:us-east-1}
      endpoint: ${AWS_S3_ENDPOINT:} # optional custom endpoint for localstack or minio
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      retention-days: ${AWS_S3_RETENTION_DAYS:365}
      kms-key-id: ${AWS_KMS_KEY_ID:}
      path-style-access: ${AWS_S3_PATH_STYLE_ACCESS:false}
  scheduling:
    verification-cron: "0 0 * * * *" # Hourly
