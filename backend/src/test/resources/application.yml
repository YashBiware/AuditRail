spring:
  datasource:
    url: jdbc:h2:mem:auditrail_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

auditrail:
  security:
    jwt-secret: TestSecretKeyMustBeAtLeast256BitsLongForHmacSha256Signature2026!
    jwt-expiration-ms: 3600000
  storage:
    provider: LOCAL
    local-dir: ./target/test-checkpoints
