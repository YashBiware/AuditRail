spring:
  datasource:
    url: jdbc:h2:file:./data/auditrail_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

auditrail:
  storage:
    provider: LOCAL
    local-dir: ./checkpoints_storage
