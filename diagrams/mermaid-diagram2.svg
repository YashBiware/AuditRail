<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.705 182.5" width="1279.705" height="182.5" style="--bg:#18181B;--fg:#F4F4F5;--line:#71717A;--muted:#A1A1AA;--surface:#27272A;--border:#3F3F46;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="App" data-to="Queue" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="Non-blocking Publish" points="196.805,84.75 232.80500000000004,84.75 232.80500000000004,58.45 390.07000000000005,58.45" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="App" data-to="User" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="Instant Success" points="196.805,97.05000000000001 232.805,97.05000000000001 232.805,123.35000000000001 390.07000000000005,123.35000000000001" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Queue" data-to="Worker" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="597.263,58.45 657.44,58.45" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Worker" data-to="AuditRail" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="HTTPS POST" points="866.115,58.45 1037.699,58.45" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="App" data-to="Queue" data-label="Non-blocking Publish">
  <rect x="240.80500000000006" y="42.45" width="117.44200000000004" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="299.52600000000007" y="57.6" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">Non-blocking Publish</text>
</g>
<g class="edge-label" data-from="App" data-to="User" data-label="Instant Success">
  <rect x="240.80499999999998" y="107.35000000000001" width="93.08800000000001" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="287.349" y="122.50000000000001" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">Instant Success</text>
</g>
<g class="edge-label" data-from="Worker" data-to="AuditRail" data-label="HTTPS POST">
  <rect x="910.115" y="42.45" width="83.584" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="951.907" y="57.6" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">HTTPS POST</text>
</g>
<g class="node" data-id="App" data-label="Primary Application" data-shape="rectangle">
  <rect x="40" y="72.45" width="156.805" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="118.4025" y="90.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Primary Application</text>
</g>
<g class="node" data-id="Queue" data-label="Kafka / RabbitMQ / AWS SQS" data-shape="rectangle">
  <rect x="390.07000000000005" y="40" width="207.19299999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="493.66650000000004" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Kafka / RabbitMQ / AWS SQS</text>
</g>
<g class="node" data-id="User" data-label="Customer / End User" data-shape="rectangle">
  <rect x="390.07000000000005" y="104.9" width="161.992" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="471.06600000000003" y="123.35000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Customer / End User</text>
</g>
<g class="node" data-id="Worker" data-label="AuditRail Forwarder Worker" data-shape="rectangle">
  <rect x="657.44" y="40" width="208.675" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="761.7775" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">AuditRail Forwarder Worker</text>
</g>
<g class="node" data-id="AuditRail" data-label="AuditRail Ingestion Gateway" data-shape="rectangle">
  <rect x="1037.699" y="40" width="202.00599999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1138.702" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">AuditRail Ingestion Gateway</text>
</g>
</svg>